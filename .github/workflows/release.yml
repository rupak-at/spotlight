name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-amd64:
    name: Ubuntu 24.04 (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run release:check -- "${{ github.ref_name }}"

      - name: Run release checks
        run: |
          npm test
          npm run lint
          npm run format:check

      - name: Build package and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Spotlight ${{ github.ref_name }}
          releaseBody: Download the Ubuntu amd64 .deb below and follow the installation guide in the repository.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles deb
